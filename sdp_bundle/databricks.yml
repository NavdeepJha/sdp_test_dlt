# This is a Declarative Automation Bundle definition for sdp_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sdp_bundle
  uuid: 7b43a176-8cca-4841-b552-5d3c5f46d8fc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-601753c5-eb63.cloud.databricks.com
    variables:
      catalog: mycatalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-601753c5-eb63.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/navdeepgcet14@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mycatalog
      schema: prod
    permissions:
      - user_name: navdeepgcet14@gmail.com
        level: CAN_MANAGE
